name: Daily API Automation Tests

on:
  schedule:
    # Run daily at 2:00 AM UTC (adjust timezone as needed)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/test/**'
      - 'src/main/**'
      - '.github/workflows/daily-api-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: ecommerce_users
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Spring Boot Application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce_users
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/ecommerce
        run: |
          mvn spring-boot:run &
          echo $! > app.pid
          # Wait for application to start
          timeout 120 bash -c 'until curl -f http://localhost:8800/bliCommerce/UserController/Sign-In; do sleep 2; done' || true
        continue-on-error: true

      - name: Wait for application to be ready
        run: |
          sleep 30
          # Check if application is running
          curl -f http://localhost:8800/actuator/health || echo "Health endpoint not available, continuing..."

      - name: Run API Automation Tests
        env:
          API_BASE_URL: http://localhost:8800
        run: |
          mvn clean test -Dtest=TestRunner -Dcucumber.filter.tags="@SignUp or @SignIn or @PasswordReset or @PasswordChange or @AccountDeletion or @AccountDeactivation"
        continue-on-error: true

      - name: Generate Test Report
        if: always()
        run: |
          mkdir -p test-reports
          # Copy Cucumber reports
          cp -r target/cucumber-reports test-reports/ || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ github.run_number }}
          path: |
            test-reports/
            target/cucumber-reports/

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Test Results
          path: target/cucumber-reports/Cucumber.xml
          reporter: java-junit
          fail-on-error: false

      - name: Stop Spring Boot Application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi
          pkill -f spring-boot:run || true

      - name: Send Notification on Failure
        if: failure()
        run: |
          echo "API Tests failed. Check the reports for details."
          # Add your notification logic here (email, Slack, etc.)

